<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMNEWDAY 2026 — 티켓 생성기</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{background:#0e0e14;color:#fff;font-family:'Apple SD Gothic Neo',Pretendard,-apple-system,sans-serif;min-height:100vh;padding:20px}
h1{font-size:18px;font-weight:800;margin-bottom:2px}
.sub{font-size:11px;color:rgba(255,255,255,.45);margin-bottom:20px}
.wrap{max-width:900px;margin:0 auto}
.tabs{display:flex;gap:0;margin-bottom:20px;background:#17171f;border-radius:10px;padding:4px}
.tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;border-radius:8px;color:rgba(255,255,255,.45);transition:all .15s;border:none;background:transparent;-webkit-appearance:none;appearance:none;outline:none;font-family:inherit}
.tab.on-a{background:#fff;color:#0e0e14}
.tab.on-p{background:#F97316;color:#fff}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:640px){.layout{grid-template-columns:1fr}}
.panel{background:#17171f;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:20px}
.panel h2{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:rgba(255,255,255,.45);letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(255,255,255,.04);color:#fff;font-size:14px;font-family:inherit;outline:none}
.field input:focus{border-color:rgba(255,255,255,.3)}
.field input::placeholder{color:rgba(255,255,255,.2)}
.err{font-size:11px;color:#f87171;margin-top:4px;display:none}
.branch-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bb{padding:10px;cursor:pointer;font-family:inherit;border-radius:8px;border:2px solid transparent;font-size:12px;font-weight:700;text-align:center;background:rgba(255,255,255,.04);color:rgba(255,255,255,.45);transition:all .15s;-webkit-appearance:none;appearance:none;outline:none}
.bb.guri{color:#93C5FD}.bb.guri.on{background:rgba(147,197,253,.12);border-color:#93C5FD}
.bb.misa{color:#F9A8D4}.bb.misa.on{background:rgba(249,168,212,.12);border-color:#F9A8D4}
.bb.bundang{color:#86EFAC}.bb.bundang.on{background:rgba(134,239,172,.12);border-color:#86EFAC}
.bb.anyang{color:#C4B5FD}.bb.anyang.on{background:rgba(196,181,253,.12);border-color:#C4B5FD}
.seat-row{display:grid;grid-template-columns:80px 1fr;gap:8px}
.seat-hint{font-size:11px;color:rgba(255,255,255,.45);margin-top:4px}
.btn-gen{width:100%;padding:13px;background:#fff;color:#0e0e14;border:none;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px}
.btn-gen.p-mode{background:#F97316;color:#fff}
.batch-area{margin-top:16px;border-top:1px solid rgba(255,255,255,.1);padding-top:16px}
.batch-lbl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:8px}
.batch-hint{font-size:11px;color:rgba(255,255,255,.45);margin-bottom:8px;line-height:1.6}
.batch-ta{width:100%;height:100px;padding:10px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(255,255,255,.04);color:rgba(255,255,255,.75);font-size:11px;font-family:monospace;resize:vertical;outline:none;line-height:1.7}
.btn-batch{width:100%;padding:11px;background:rgba(255,255,255,.08);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}
.prog{display:none;margin-top:10px}
.prog-bar{height:3px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:#fff;border-radius:99px;transition:width .2s;width:0}
.prog-txt{font-size:11px;color:rgba(255,255,255,.45);margin-top:5px;text-align:center}
.preview-panel{display:flex;flex-direction:column;gap:12px}
.preview-box{background:#17171f;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px}
#ph{aspect-ratio:.69;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:rgba(255,255,255,.45);font-size:13px}
#pi{width:100%;border-radius:8px;display:none}
.dl-row{display:flex;gap:8px}
.btn-dl{flex:1;padding:11px;border:none;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-dl-a{background:#fff;color:#0e0e14}
.btn-dl-p{background:#F97316;color:#fff}
.btn-dl-g{flex:1;padding:11px;background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:#fff}
#ticket-area{position:fixed;left:-9999px;top:0;width:600px}
.t-root{width:600px;font-family:'Apple SD Gothic Neo',Pretendard,sans-serif;overflow:hidden}
.t-poster{width:600px;height:870px;position:relative;overflow:hidden}
.t-poster img{width:100%;height:100%;object-fit:cover;display:block}
.t-badge{position:absolute;top:20px;right:20px;font-size:10px;font-weight:800;letter-spacing:2px;padding:5px 12px;border-radius:20px;text-transform:uppercase}
.t-badge-a{background:rgba(255,255,255,.9);color:#0e0e14}
.t-badge-p{background:#F97316;color:#fff}
.t-info{background:#08080f;padding:24px 32px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.06)}
.t-left{display:flex;flex-direction:column;gap:12px}
.t-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:3px}
.t-name{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.5px;line-height:1}
.t-seat{font-size:36px;font-weight:900;letter-spacing:-1px;line-height:1}
.t-div{width:1px;height:90px;background:rgba(255,255,255,.08);margin:0 8px}
.t-qr{background:#fff;border-radius:10px;padding:10px;width:100px;height:100px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.t-foot{background:#050508;padding:10px 32px;display:flex;justify-content:space-between}
.t-foot-l,.t-foot-r{font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.2);text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <h1>IMNEWDAY 2026 티켓 생성기</h1>
  <div class="sub">IMNEWDANCE 9TH ANNIVERSARY · 2026.8.8 동서울대학교 대강당</div>
  <div class="tabs">
    <button class="tab on-a" id="tab-a" onclick="setMode('a')">🎫 관객 티켓</button>
    <button class="tab" id="tab-p" onclick="setMode('p')">🎭 참가자 티켓</button>
  </div>
  <div class="layout">
    <div class="panel">
      <h2 id="form-title">관객 정보 입력</h2>
      <div class="field">
        <label>이름</label>
        <input type="text" id="inp-name" placeholder="예: 홍길동" maxlength="10">
      </div>
      <div class="field">
        <label>지점</label>
        <div class="branch-btns">
          <button class="bb guri on" data-b="구리" onclick="setBranch(this)">구리점</button>
          <button class="bb misa" data-b="미사" onclick="setBranch(this)">미사점</button>
          <button class="bb bundang" data-b="분당" onclick="setBranch(this)">분당점</button>
          <button class="bb anyang" data-b="안양" onclick="setBranch(this)">안양점</button>
        </div>
      </div>
      <div class="field" id="seat-field">
        <label>좌석</label>
        <div class="seat-row">
          <input type="text" id="inp-zone" placeholder="행 (A)" maxlength="2" style="text-transform:uppercase;text-align:center;font-weight:700;font-size:16px">
          <input type="number" id="inp-num" placeholder="번호 (23)" min="1" max="99">
        </div>
        <div class="seat-hint" id="seat-hint">예: A행 23번 → <strong style="color:#fff">A-23</strong></div>
        <div class="err" id="seat-err">유효하지 않은 좌석입니다.</div>
      </div>
      <button class="btn-gen" id="btn-gen" onclick="doGenerate()">🎫 티켓 생성</button>
      <div class="batch-area">
        <div class="batch-lbl">배치 발급</div>
        <div class="batch-hint" id="b-hint">관객: <code style="color:#93C5FD">이름,행,번호</code> (예: 홍길동,A,23)</div>
        <textarea class="batch-ta" id="batch-ta" placeholder="홍길동,A,23&#10;이영희,B,12"></textarea>
        <button class="btn-batch" id="btn-batch" onclick="doBatch()">📦 일괄 생성</button>
        <div class="prog" id="prog">
          <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
          <div class="prog-txt" id="prog-txt"></div>
        </div>
        <div id="batch-next-wrap" style="display:none;margin-top:8px">
          <button class="btn-batch" id="btn-next" onclick="downloadNextInQueue()" style="background:#F97316;color:#fff">⬇ 다음 이미지 저장</button>
          <div style="font-size:11px;color:rgba(255,255,255,.45);text-align:center;margin-top:6px">모바일에서는 이미지를 한 장씩 순서대로 저장합니다.</div>
        </div>
      </div>
    </div>
    <div class="preview-panel">
      <div class="preview-box">
        <h2 style="margin-bottom:12px">티켓 미리보기</h2>
        <div id="ph"><span style="font-size:32px">🎫</span><span>티켓을 생성하면 표시됩니다</span></div>
        <img id="pi" alt="미리보기">
      </div>
      <div id="dl-sec" style="display:none">
        <div class="dl-row">
          <button class="btn-dl btn-dl-a" id="btn-dl" onclick="dlCurrent()">⬇ 티켓 저장</button>
          <button class="btn-dl-g" onclick="prtCurrent()">🖨 인쇄</button>
        </div>
        <div style="font-size:11px;color:rgba(255,255,255,.45);text-align:center;margin-top:6px" id="cur-info"></div>
      </div>
      <div class="preview-box" id="notice-box" style="display:none">
        <h2 style="margin-bottom:12px">주의사항 미리보기</h2>
        <img id="ni" alt="주의사항 안내" style="width:100%;border-radius:8px">
      </div>
      <div id="notice-dl-sec" style="display:none">
        <button class="btn-dl-g" style="width:100%" onclick="dlNotice()">⬇ 주의사항 이미지 저장</button>
      </div>
    </div>
  </div>
</div>

function setBranch(el) {
  document.querySelectorAll('.bb').forEach(function(b){ b.classList.remove('on'); });
  el.classList.add('on');
  branch = el.dataset.b;
}

function chkSeat(zone, num) {
  if (!VALID[zone]) return false;
  return VALID[zone].indexOf(parseInt(num)) >= 0;
}

function doGenerate() {
  var name = document.getElementById('inp-name').value.trim();
  if (!name) { alert('이름을 입력하세요.'); return; }
  var label = '';
  if (mode === 'a') {
    var zone = document.getElementById('inp-zone').value.trim().toUpperCase();
    var num = document.getElementById('inp-num').value.trim();
    if (!zone || !num) { alert('좌석 행과 번호를 입력하세요.'); return; }
    var errEl = document.getElementById('seat-err');
    if (!chkSeat(zone, num)) { errEl.style.display = 'block'; return; }
    errEl.style.display = 'none';
    label = zone + '-' + num;
  } else {
    label = branch;
  }
  renderTicket(name, label, function(dataUrl) {
    curDataUrl = dataUrl;
    curLabel = (mode === 'a' ? label : branch + '_' + name);
    document.getElementById('ph').style.display = 'none';
    document.getElementById('pi').src = dataUrl;
    document.getElementById('pi').style.display = 'block';
    document.getElementById('dl-sec').style.display = 'block';
    document.getElementById('cur-info').textContent = name + ' · ' + (mode === 'a' ? label : branch + '점');
  });
  renderNotice(function(dataUrl) {
    curNoticeUrl = dataUrl;
    document.getElementById('notice-box').style.display = 'block';
    document.getElementById('ni').src = dataUrl;
    document.getElementById('notice-dl-sec').style.display = 'block';
  });
}

function renderTicket(name, label, cb) {
  var wrap = document.getElementById('ticket-area');
  wrap.innerHTML = '';
  var qrDiv = document.createElement('div');
  qrDiv.style.cssText = 'position:absolute;left:-9999px;top:0;width:90px;height:90px';
  document.body.appendChild(qrDiv);
  var qrText = mode === 'p' ? ('PERFORMER:' + branch + ':' + name) : ('AUDIENCE:' + label);
  new QRCode(qrDiv, {text: qrText, width:90, height:90, colorDark:'#000', colorLight:'#fff', correctLevel:QRCode.CorrectLevel.H});
  setTimeout(function() {
    var qrCanvas = qrDiv.querySelector('canvas');
    var qrSrc = qrCanvas ? qrCanvas.toDataURL() : '';
    document.body.removeChild(qrDiv);
    var color = BRANCH_COLOR[branch] || {bg:'#fff', text:'#000'};
    var isP = mode === 'p';
    var displayLabel = isP ? (label + '점') : label;
    wrap.innerHTML = '<div class="t-root">'
      + '<div class="t-poster"><img src="data:image/jpeg;base64,' + POSTER + '" crossorigin="anonymous">'
      + '<div class="t-badge ' + (isP ? 't-badge-p' : 't-badge-a') + '">' + (isP ? 'PERFORMER' : 'AUDIENCE') + '</div></div>'
      + '<div class="t-info"><div class="t-left">'
      + '<div><div class="t-lbl">' + (isP ? '참가자' : '관람객') + '</div><div class="t-name">' + esc(name) + '</div></div>'
      + '<div><div class="t-lbl">' + (isP ? '소속 지점' : '좌석') + '</div>'
      + '<div class="t-seat" style="color:' + color.bg + '">' + esc(displayLabel) + '</div></div>'
      + '</div>'
      + '<div class="t-div"></div>'
      + '<div class="t-qr"><img src="' + qrSrc + '" width="80" height="80"></div>'
      + '</div>'
      + '<div class="t-foot"><div class="t-foot-l">IMNEWDANCE · 9TH ANNIVERSARY</div><div class="t-foot-r">2026.08.08 SAT</div></div>'
      + '</div>';
    setTimeout(function() {
      html2canvas(wrap.firstElementChild, {scale:2, useCORS:true, allowTaint:true, backgroundColor:'#08080f', logging:false})
        .then(function(canvas) {
          wrap.innerHTML = '';
          cb(canvas.toDataURL('image/png'));
        });
    }, 300);
  }, 300);
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var dlQueue = [];
var dlQueueIdx = 0;

function doBatch() {
  var raw = document.getElementById('batch-ta').value.trim();
  if (!raw) { alert('목록을 입력하세요.'); return; }
  var lines = raw.split('\n').map(function(l){ return l.trim(); }).filter(function(l){ return l; });
  var items = [];
  if (mode === 'a') {
    for (var i=0; i<lines.length; i++) {
      var parts = lines[i].split(',');
      if (parts.length < 3) { alert('형식 오류: ' + lines[i] + '\n이름,행,번호 형식으로 입력하세요.'); return; }
      var zone = parts[1].trim().toUpperCase();
      var num = parts[2].trim();
      if (!chkSeat(zone, num)) { alert('유효하지 않은 좌석: ' + zone + '-' + num); return; }
      items.push({name: parts[0].trim(), label: zone + '-' + num});
    }
  } else {
    for (var i=0; i<lines.length; i++) {
      items.push({name: lines[i], label: branch});
    }
  }

  if (IS_MOBILE) {
    document.getElementById('btn-batch').disabled = true;
    runBatchMobile(items, 0);
  } else {
    loadJSZip(function() { runBatchZip(items, 0, new JSZip()); });
  }
}

function loadJSZip(cb) {
  if (window.JSZip) { cb(); return; }
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
  s.onload = cb;
  document.head.appendChild(s);
}

// PC: ZIP 일괄 생성
function runBatchZip(items, idx, zip) {
  var prog = document.getElementById('prog');
  var pf = document.getElementById('prog-fill');
  var pt = document.getElementById('prog-txt');
  prog.style.display = 'block';
  if (idx >= items.length) {
    renderNotice(function(noticeUrl) {
      zip.file('IMNEWDAY2026_주의사항.png', noticeUrl.split(',')[1], {base64:true});
      pt.textContent = items.length + '장 ZIP 다운로드 중...';
      zip.generateAsync({type:'blob'}).then(function(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'IMNEWDAY2026_' + (mode==='p' ? '참가자' : '관객') + '_tickets.zip';
        a.click();
        URL.revokeObjectURL(url);
        pt.textContent = '✓ ' + items.length + '장 완료 (주의사항 포함)';
      });
    });
    return;
  }
  var item = items[idx];
  pt.textContent = '(' + (idx+1) + '/' + items.length + ') ' + item.name + ' 생성 중...';
  pf.style.width = ((idx+1)/items.length*100) + '%';
  renderTicket(item.name, item.label, function(dataUrl) {
    var b64 = dataUrl.split(',')[1];
    var prefix = mode==='p' ? '참가자' : '관객';
    zip.file('IMNEWDAY2026_' + prefix + '_' + item.label + '_' + item.name + '.png', b64, {base64:true});
    runBatchZip(items, idx+1, zip);
  });
}

// 모바일: 이미지 순서대로 하나씩 다운로드 (ZIP 불가 환경 대응)
function runBatchMobile(items, idx) {
  document.getElementById('prog').style.display = 'block';
  renderNotice(function(noticeUrl) {
    buildMobileQueue(items, 0, [], noticeUrl);
  });
}

function buildMobileQueue(items, idx, acc, noticeUrl) {
  var pt = document.getElementById('prog-txt');
  if (idx >= items.length) {
    acc.push({name: 'IMNEWDAY2026_주의사항.png', url: noticeUrl});
    dlQueue = acc;
    dlQueueIdx = 0;
    document.getElementById('prog').style.display = 'none';
    document.getElementById('batch-next-wrap').style.display = 'block';
    document.getElementById('btn-batch').disabled = false;
    pt.textContent = '';
    downloadNextInQueue();
    return;
  }
  var item = items[idx];
  pt.textContent = '(' + (idx+1) + '/' + items.length + ') ' + item.name + ' 생성 중...';
  renderTicket(item.name, item.label, function(dataUrl) {
    var prefix = mode==='p' ? '참가자' : '관객';
    acc.push({name: 'IMNEWDAY2026_' + prefix + '_' + item.label + '_' + item.name + '.png', url: dataUrl});
    buildMobileQueue(items, idx+1, acc, noticeUrl);
  });
}

function downloadNextInQueue() {
  if (dlQueueIdx >= dlQueue.length) {
    document.getElementById('batch-next-wrap').style.display = 'none';
    alert('모든 이미지 저장이 완료되었습니다.');
    return;
  }
  var item = dlQueue[dlQueueIdx];
  var a = document.createElement('a');
  a.href = item.url;
  a.download = item.name;
  a.click();
  dlQueueIdx++;
  var btn = document.getElementById('btn-next');
  if (dlQueueIdx >= dlQueue.length) {
    btn.textContent = '✓ 전체 완료 (' + dlQueue.length + '장)';
  } else {
    btn.textContent = '⬇ 다음 이미지 저장 (' + (dlQueueIdx+1) + '/' + dlQueue.length + ')';
  }
}

document.getElementById('inp-zone').addEventListener('input', function(){
  this.value = this.value.toUpperCase();
});
document.getElementById('inp-num').addEventListener('input', function(){
  var zone = document.getElementById('inp-zone').value.trim().toUpperCase();
  var num = this.value.trim();
  var errEl = document.getElementById('seat-err');
  var hint = document.getElementById('seat-hint');
  if (zone && num && VALID[zone]) {
    var valid = chkSeat(zone, num);
    errEl.style.display = valid ? 'none' : 'block';
    var mn = Math.min.apply(null, VALID[zone]);
    var mx = Math.max.apply(null, VALID[zone]);
    hint.innerHTML = zone + '행: ' + mn + '~' + mx + '번 | <strong style="color:#fff">' + zone + '-' + num + '</strong>';
  }
});


// 카카오 인앱브라우저 등 호환성 대응: 모든 버튼 클릭 이벤트 재바인딩
(function(){
  function bindTap(el, fn){
    var fired = false;
    el.addEventListener('touchend', function(e){
      fired = true;
      e.preventDefault();
      fn.call(el, e);
    }, {passive:false});
    el.addEventListener('click', function(e){
      if(fired){ fired = false; return; }
      fn.call(el, e);
    });
  }
  document.querySelectorAll('.tab').forEach(function(el){
    var mode = el.id === 'tab-a' ? 'a' : 'p';
    bindTap(el, function(){ setMode(mode); });
  });
  document.querySelectorAll('.bb').forEach(function(el){
    bindTap(el, function(){ setBranch(el); });
  });
  var genBtn = document.getElementById('btn-gen');
  if(genBtn) bindTap(genBtn, doGenerate);
  var batchBtn = document.getElementById('btn-batch');
  if(batchBtn) bindTap(batchBtn, doBatch);
})();

</script>
