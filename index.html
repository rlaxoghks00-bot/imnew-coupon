<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아임뉴댄스 쿠폰 관리</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: #F5F4F0; color: #1a1a1a;
    min-height: 100vh; padding: 20px;
  }
  .app { max-width: 960px; margin: 0 auto; }

  /* 상단 */
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .top-title { font-size: 20px; font-weight: 800; color: #2C2416; display: flex; align-items: center; gap: 8px; }
  .add-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 20px; border-radius: 10px;
    background: #2C2416; color: #C4974A;
    font-size: 15px; font-weight: 700;
    border: none; cursor: pointer;
  }
  .add-btn:hover { opacity: 0.85; }

  /* 요약 */
  .summary { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 20px; }
  .sum-card { background: #fff; border-radius: 12px; padding: 18px 20px; border: 1px solid #E8E4DC; text-align: center; }
  .sum-label { font-size: 11px; font-weight: 700; color: #999; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
  .sum-val { font-size: 28px; font-weight: 900; color: #2C2416; }
  .sum-val.warn { color: #D97706; }

  /* 그리드 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }

  .card {
    background: #fff; border-radius: 14px;
    padding: 22px; border: 1.5px solid #E8E4DC;
    display: flex; flex-direction: column; gap: 14px;
    transition: box-shadow 0.2s;
  }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.07); }
  .card.flash { box-shadow: 0 0 0 3px #C4974A; }

  /* 카드 헤더 */
  .card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-name-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .card-name { font-size: 18px; font-weight: 800; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .edit-name-btn { background: none; border: none; cursor: pointer; color: #ccc; font-size: 15px; padding: 2px; flex-shrink: 0; }
  .edit-name-btn:hover { color: #C4974A; }
  .card-delete { background: none; border: none; cursor: pointer; color: #ccc; font-size: 16px; padding: 2px; flex-shrink: 0; }
  .card-delete:hover { color: #ef4444; }

  /* 이름 편집 인풋 */
  .name-edit-row { display: flex; gap: 6px; }
  .name-input {
    flex: 1; font-size: 15px; padding: 7px 10px;
    border-radius: 8px; border: 1.5px solid #C4974A;
    font-family: inherit; outline: none; color: #111;
  }
  .name-save-btn {
    padding: 7px 14px; border-radius: 8px;
    background: #2C2416; color: #C4974A;
    font-size: 13px; font-weight: 700;
    border: none; cursor: pointer;
  }

  /* 쿠폰 타입 */
  .type-row { display: flex; align-items: center; justify-content: space-between; }
  .coupon-type { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 100px; font-size: 12px; font-weight: 700; }
  .type-5  { background: #FEF3C7; color: #92400E; }
  .type-10 { background: #DCFCE7; color: #14532D; }

  /* 재충전 버튼 */
  .refill-btn {
    background: none; border: 1px solid #E8E4DC;
    border-radius: 6px; padding: 3px 10px;
    font-size: 12px; font-weight: 600; color: #999;
    cursor: pointer; font-family: inherit;
  }
  .refill-btn:hover { border-color: #C4974A; color: #C4974A; }

  /* 잔여 */
  .remain-row { display: flex; align-items: baseline; gap: 6px; }
  .remain-num { font-size: 34px; font-weight: 900; color: #2C2416; line-height: 1; }
  .remain-num.danger { color: #ef4444; }
  .remain-label { font-size: 14px; color: #999; }

  /* 도트 */
  .dots-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .dot { width: 20px; height: 20px; border-radius: 50%; background: #F0EBE0; border: 1.5px solid #E0D8CC; transition: all 0.2s; }
  .dot.used-5  { background: #D97706; border-color: #D97706; }
  .dot.used-10 { background: #16A34A; border-color: #16A34A; }

  /* 차감 버튼 */
  .deduct-btn {
    width: 100%; padding: 13px;
    font-size: 16px; font-weight: 700;
    border-radius: 10px; cursor: pointer;
    border: 1.5px solid #E8E4DC;
    background: #F5F4F0; color: #2C2416;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: all 0.15s; font-family: inherit;
  }
  .deduct-btn:hover:not(:disabled) { background: #2C2416; color: #C4974A; border-color: #2C2416; }
  .deduct-btn:active:not(:disabled) { transform: scale(0.97); }
  .deduct-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .deduct-btn.done { background: #F0FDF4; color: #16A34A; border-color: #86EFAC; }

  /* 마지막 수강 */
  .last-visit { font-size: 12px; color: #bbb; text-align: center; min-height: 16px; }

  /* 빈 상태 */
  .empty { grid-column: 1/-1; padding: 60px; text-align: center; color: #bbb; font-size: 15px; }

  /* 모달 공통 */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(2px);
  }
  .modal {
    background: #fff; border-radius: 16px;
    padding: 28px; width: 300px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    display: flex; flex-direction: column; gap: 14px;
  }
  .modal-title { font-size: 18px; font-weight: 800; color: #111; }
  .modal input, .modal select {
    width: 100%; font-size: 15px; padding: 12px 14px;
    border-radius: 10px; border: 1.5px solid #E8E4DC;
    background: #F5F4F0; color: #111;
    font-family: inherit; outline: none;
  }
  .modal input:focus, .modal select:focus { border-color: #C4974A; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button {
    flex: 1; padding: 12px; font-size: 15px; font-weight: 700;
    border-radius: 10px; cursor: pointer; font-family: inherit;
    border: 1.5px solid #E8E4DC;
  }
  .btn-confirm { background: #2C2416; color: #C4974A; border-color: #2C2416; }
  .btn-cancel  { background: #F5F4F0; color: #666; }

  .reset-btn {
    background: none; color: #ccc; border: 1px solid #E8E4DC;
    padding: 8px 14px; border-radius: 8px;
    font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .reset-btn:hover { color: #ef4444; border-color: #ef4444; }
</style>
</head>
<body>
<div class="app">

  <div class="top-bar">
    <div class="top-title">🎟️ 쿠폰 차감 관리</div>
    <div style="display:flex;gap:8px;">
      <button class="reset-btn" onclick="resetAll()">전체 초기화</button>
      <button class="add-btn" onclick="openModal()">＋ 수강생 추가</button>
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <div class="grid" id="grid"></div>

</div>

<!-- 추가 모달 -->
<div class="modal-overlay" id="modal" style="display:none;">
  <div class="modal">
    <div class="modal-title">수강생 등록</div>
    <input type="text" id="m-name" placeholder="이름을 입력하세요" />
    <select id="m-type">
      <option value="5">5회 쿠폰</option>
      <option value="10">10회 쿠폰</option>
    </select>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-confirm" onclick="addStudent()">등록</button>
    </div>
  </div>
</div>

<!-- 재충전 모달 -->
<div class="modal-overlay" id="refill-modal" style="display:none;">
  <div class="modal">
    <div class="modal-title">쿠폰 재충전</div>
    <div id="refill-name" style="font-size:15px;color:#666;"></div>
    <select id="r-type">
      <option value="5">5회 쿠폰으로 재충전</option>
      <option value="10">10회 쿠폰으로 재충전</option>
    </select>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeRefill()">취소</button>
      <button class="btn-confirm" onclick="doRefill()">재충전</button>
    </div>
  </div>
</div>

<script>
const KEY = 'imnew_coupon_v4';
let refillTargetId = null;

function load() {
  try { const d = localStorage.getItem(KEY); return d ? JSON.parse(d) : []; } catch { return []; }
}
function save(data) { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} }

function fmt(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function renderSummary(data) {
  const active = data.filter(s => s.used < s.total).length;
  const expired = data.filter(s => s.used >= s.total).length;
  document.getElementById('summary').innerHTML = `
    <div class="sum-card"><div class="sum-label">전체 수강생</div><div class="sum-val">${data.length}명</div></div>
    <div class="sum-card"><div class="sum-label">이용 가능</div><div class="sum-val">${active}명</div></div>
    <div class="sum-card"><div class="sum-label">쿠폰 소진</div><div class="sum-val warn">${expired}명</div></div>`;
}

function render() {
  const data = load();
  renderSummary(data);
  const grid = document.getElementById('grid');
  if (!data.length) {
    grid.innerHTML = `<div class="empty">➕ 수강생을 추가해 주세요</div>`;
    return;
  }
  grid.innerHTML = data.map(s => {
    const rem = s.total - s.used;
    const typeClass = s.total === 5 ? 'type-5' : 'type-10';
    const dotUsed = s.total === 5 ? 'used-5' : 'used-10';
    const dots = Array.from({length: s.total}, (_, i) =>
      `<div class="dot ${i < s.used ? dotUsed : ''}"></div>`).join('');
    const isDone = rem <= 0;
    const last = s.history.length ? `마지막 수강: ${fmt(s.history[s.history.length-1])}` : '수강 기록 없음';
    return `
    <div class="card" id="card-${s.id}">
      <div class="card-header">
        <div class="card-name-wrap">
          <span class="card-name" id="name-${s.id}">${s.name}</span>
          <button class="edit-name-btn" onclick="toggleEdit(${s.id})" title="이름 수정">✏️</button>
        </div>
        <button class="card-delete" onclick="del(${s.id})">✕</button>
      </div>
      <div class="name-edit-row" id="edit-${s.id}" style="display:none;">
        <input class="name-input" id="ninput-${s.id}" value="${s.name}" placeholder="새 이름" />
        <button class="name-save-btn" onclick="saveName(${s.id})">저장</button>
      </div>
      <div class="type-row">
        <span class="coupon-type ${typeClass}">${s.total}회 쿠폰</span>
        <button class="refill-btn" onclick="openRefill(${s.id})">🔄 재충전</button>
      </div>
      <div class="remain-row">
        <span class="remain-num ${rem <= 1 && !isDone ? 'danger' : ''}">${rem}</span>
        <span class="remain-label">회 남음</span>
      </div>
      <div class="dots-wrap">${dots}</div>
      <button class="deduct-btn ${isDone ? 'done' : ''}" onclick="deduct(${s.id})" ${isDone ? 'disabled' : ''}>
        ${isDone ? '✅ 쿠폰 소진' : '－ 1회 차감'}
      </button>
      <div class="last-visit">${last}</div>
    </div>`;
  }).join('');
}

function deduct(id) {
  const data = load();
  const s = data.find(x => x.id === id);
  if (!s || s.used >= s.total) return;
  s.used++; s.history.push(new Date().toISOString());
  save(data); render();
  const card = document.getElementById('card-' + id);
  if (card) { card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 500); }
}

function del(id) {
  if (!confirm('이 수강생을 삭제할까요?')) return;
  save(load().filter(x => x.id !== id)); render();
}

function toggleEdit(id) {
  const row = document.getElementById('edit-' + id);
  const visible = row.style.display !== 'none';
  row.style.display = visible ? 'none' : 'flex';
  if (!visible) document.getElementById('ninput-' + id).focus();
}

function saveName(id) {
  const newName = document.getElementById('ninput-' + id).value.trim();
  if (!newName) { alert('이름을 입력해 주세요'); return; }
  const data = load();
  const s = data.find(x => x.id === id);
  if (s) { s.name = newName; save(data); render(); }
}

function openRefill(id) {
  refillTargetId = id;
  const data = load();
  const s = data.find(x => x.id === id);
  document.getElementById('refill-name').textContent = s ? `${s.name} 님의 쿠폰을 재충전합니다` : '';
  document.getElementById('r-type').value = s ? String(s.total) : '5';
  document.getElementById('refill-modal').style.display = 'flex';
}
function closeRefill() { document.getElementById('refill-modal').style.display = 'none'; refillTargetId = null; }
function doRefill() {
  if (!refillTargetId) return;
  const data = load();
  const s = data.find(x => x.id === refillTargetId);
  if (s) { s.total = parseInt(document.getElementById('r-type').value); s.used = 0; s.history = []; save(data); render(); }
  closeRefill();
}

function resetAll() {
  if (!confirm('모든 데이터를 초기화할까요?\n복구되지 않습니다.')) return;
  localStorage.removeItem(KEY); render();
}

let nextId = Date.now();
function openModal() { document.getElementById('modal').style.display = 'flex'; document.getElementById('m-name').focus(); }
function closeModal() { document.getElementById('modal').style.display = 'none'; document.getElementById('m-name').value = ''; }
function addStudent() {
  const name = document.getElementById('m-name').value.trim();
  const total = parseInt(document.getElementById('m-type').value);
  if (!name) { alert('이름을 입력해 주세요'); return; }
  const data = load();
  data.push({ id: ++nextId, name, total, used: 0, history: [] });
  save(data); closeModal(); render();
}

document.getElementById('m-name').addEventListener('keydown', e => { if (e.key === 'Enter') addStudent(); });
document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });
document.getElementById('refill-modal').addEventListener('click', e => { if (e.target === document.getElementById('refill-modal')) closeRefill(); });

render();
</script>
</body>
</html>
